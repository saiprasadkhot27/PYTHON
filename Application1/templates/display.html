<!DOCTYPE html>
<html>
<head>
    <title>Display Data</title>
</head>
<body>

<h2>Student Records</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Mobile</th>
    <th>Email</th>
    <th>Age</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/">Back</a>

</body>
</html>
