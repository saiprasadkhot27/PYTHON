<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Successful</title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .box {
            background: white;

            width: 400px;

            padding: 40px;

            text-align: center;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: green;
        }

        p {
            font-size: 18px;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 20px;

            background: #333;

            color: white;

            text-decoration: none;

            border-radius: 5px;
        }

        a:hover {
            background: #555;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Login Successful!</h1>

        <p>
            Your username, email, password and mobile
            number passed the validation.
        </p>

        <a href="/">
            Back to Login
        </a>

    </div>

</body>

</html>
